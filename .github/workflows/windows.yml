name: Windows tests

on:
  push:
  pull_request:

jobs:
  focused-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv run pytest tests/test_embeddings.py tests/test_setup_cli.py
